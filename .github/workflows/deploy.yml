name: Deploy to Server

on:
  push:
    branches:
      # jalan setiap push ke branch main
      - main
jobs:
  # deploy to server
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no root@34.2.139.16 << 'EOF'
            cd /var/www/kainnovacp

            # pull kode terbaru
            git reset --hard
            git pull origin main

            # install dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # migrate database Laravel
            php artisan migrate --force
            
            # use local public disk for uploads (e.g. bind-mounted storage/app/public)
            echo "Ensuring FILESYSTEM_DISK=public..."
            if grep -q '^FILESYSTEM_DISK=' .env; then sed -i 's|^FILESYSTEM_DISK=.*|FILESYSTEM_DISK=public|' .env; else echo 'FILESYSTEM_DISK=public' >> .env; fi
            sudo -u www-data php artisan storage:link --force 2>/dev/null || true

            # EMERGENCY FIX: Force fix permissions
            echo "Fixing permissions..."
            
            # Stop web server temporarily
            systemctl stop nginx 2>/dev/null || systemctl stop apache2 2>/dev/null || true
            
            # Fix ownership
            chown -R www-data:www-data /var/www/kainnovacp/storage
            chown -R www-data:www-data /var/www/kainnovacp/bootstrap/cache
            chown -R www-data:www-data /var/www/kainnovacp/storage/app
            
            # Fix permissions
            chmod -R 775 /var/www/kainnovacp/storage
            chmod -R 775 /var/www/kainnovacp/bootstrap/cache
            
            # Remove and recreate log file
            rm -f /var/www/kainnovacp/storage/logs/laravel.log
            touch /var/www/kainnovacp/storage/logs/laravel.log
            chown www-data:www-data /var/www/kainnovacp/storage/logs/laravel.log
            chmod 664 /var/www/kainnovacp/storage/logs/laravel.log
            
            # Start web server
            systemctl start nginx 2>/dev/null || systemctl start apache2 2>/dev/null || true

            # optimize laravel
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache
          EOF