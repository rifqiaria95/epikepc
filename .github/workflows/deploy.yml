name: Deploy to Server

on:
  push:
    branches:
      - main   # jalan setiap push ke branch main

jobs:
  # deploy to server
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no root@34.2.139.16 << 'EOF'
            cd /var/www/kaiproject1

            # pull kode terbaru
            git reset --hard
            git pull origin main

            # install dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # migrate database
            php artisan migrate --force
            
            # fix GCS environment variables
            echo "Fixing GCS environment variables..."
            sed -i 's|GOOGLE_CLOUD_KEY_FILE=.*|GOOGLE_CLOUD_KEY_FILE=storage/app/gcs-service-account.json|' .env
            sed -i 's|FILESYSTEM_DISK=.*|FILESYSTEM_DISK=gcs|' .env

            # EMERGENCY FIX: Force fix permissions
            echo "Fixing permissions..."
            
            # Stop web server temporarily
            systemctl stop nginx 2>/dev/null || systemctl stop apache2 2>/dev/null || true
            
            # Fix ownership
            chown -R www-data:www-data /var/www/kaiproject1/storage
            chown -R www-data:www-data /var/www/kaiproject1/bootstrap/cache
            chown -R www-data:www-data /var/www/kaiproject1/storage/app
            
            # Fix permissions
            chmod -R 775 /var/www/kaiproject1/storage
            chmod -R 775 /var/www/kaiproject1/bootstrap/cache
            
            # Remove and recreate log file
            rm -f /var/www/kaiproject1/storage/logs/laravel.log
            touch /var/www/kaiproject1/storage/logs/laravel.log
            chown www-data:www-data /var/www/kaiproject1/storage/logs/laravel.log
            chmod 664 /var/www/kaiproject1/storage/logs/laravel.log
            
            # Fix GCS service account permissions
            if [ -f "/var/www/kaiproject1/storage/app/gcs-service-account.json" ]; then
              chown www-data:www-data /var/www/kaiproject1/storage/app/gcs-service-account.json
              chmod 644 /var/www/kaiproject1/storage/app/gcs-service-account.json
            fi
            
            # Start web server
            systemctl start nginx 2>/dev/null || systemctl start apache2 2>/dev/null || true

            # optimize laravel
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache
          EOF